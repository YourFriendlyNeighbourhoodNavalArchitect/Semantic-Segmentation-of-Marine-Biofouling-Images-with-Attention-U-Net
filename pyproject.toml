[project]
name = "semantic-segmentation-of-marine-biofouling-images-with-attention-u-net"
version = "1.0.0"
description = "Semantic Segmentation of Marine Biofouling Images with Attention U-Net"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ioannis Karlatiras" }, { name = "Orfeas Bourchas" }]
requires-python = ">=3.13"
keywords = ["Semantic Segmentation", "Marine Biofouling", "U-Net", "Attention U-Net"]
dependencies = [
    "torch>=2.15,<3",
    "numpy>=2.5,<3",
    "albumentations>=2.0.8,<3",
    "opencv-python-headless>=5,<6",
    "pillow>=13,<14",
    "iterative-stratification>=0.1.9,<0.2",
    "optuna>=5.1,<6",
    "mlflow>=3.18,<4",
    "onnx>=1.23,<2",
    "onnxscript>=0.7.2,<0.8",
    "onnxruntime>=1.32,<2",
    "matplotlib>=3.11,<4",
    "torchinfo>=1.8,<2",
    "tqdm>=4.70,<5",
    "requests>=2.34,<3",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
biofouling = "biofouling.commandLine:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "biofouling"
module-root = ""
