# Files passed with --config are layered over this one. Tables merge key by key; arrays, [[classes]] included, are replaced whole.

seed = 42

[paths]
data = "data"
outputs = "outputs"

[split]
strategy = "stratified" # or "similarity-aware"
ratios = [0.8, 0.1, 0.1]

[model]
architecture = "Attention U-Net" # or "U-Net", "Simple CNN"
resolution = [512, 512]

[training]
batchSize = 16
numWorkers = 4
maxEpochs = 300
warmup = 10
patience = 50
plateauPatience = 10
plateauFactor = 0.5
learningRate = 4.1e-4 # best trial of the Marine 2025 study
monitor = "IoU" # drives early stopping, learning rate decay, checkpointing and tuning
monitorMode = "max"
deterministic = false

[tuning]
learningRates = [1e-5, 2e-5, 5e-5, 1e-4, 2e-4, 5e-4, 1e-3]

# Network classes, in output order (Marine 2025). Each absorbs the annotation classes listed under "annotations";
# every annotation class must be absorbed exactly once.
[[classes]]
name = "Clean Hull"
color = [0, 255, 0]
annotations = ["Clean Hull"]

[[classes]]
name = "Soft Fouling"
color = [255, 255, 106]
annotations = ["Slime/Algae"]

[[classes]]
name = "Hard Fouling"
color = [255, 87, 51]
annotations = ["Calcareous Deposits", "Barnacles/Molluscs"]

[[classes]]
name = "Background/Other"
color = [43, 138, 255]
annotations = ["Background/Other"]
