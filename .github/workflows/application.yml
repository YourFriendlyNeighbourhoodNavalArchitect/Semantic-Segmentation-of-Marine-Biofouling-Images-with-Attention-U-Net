name: Application

on:
  push:
    paths: ['Application/**']
  pull_request:
    paths: ['Application/**']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - run: dotnet build Application -c Release
